
name: Backfill Stock History

on:
  workflow_dispatch:
    inputs:
      start:
        description: "股票清單起始位置（從 0 開始）"
        required: true
        default: "0"
        type: string
      limit:
        description: "本次最多處理幾檔股票"
        required: true
        default: "20"
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download historical data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/backfill_all_stocks.py \
            --start "${{ inputs.start }}" \
            --limit "${{ inputs.limit }}"

      - name: Commit downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_history/*.json
          if git diff --cached --quiet; then
            echo "沒有新資料需要提交"
          else
            git commit -m "Backfill stock historical data batch"
            git push
          fi
